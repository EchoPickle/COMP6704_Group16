[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numpy-smo-svm"
version = "0.1.0"
description = "An educational, auditable NumPy SMO solver for binary linear SVMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7", "scikit-learn>=1.3"]
experiment = ["matplotlib>=3.7", "scikit-learn>=1.3", "threadpoolctl>=3.1"]
dev = ["pytest>=7", "scikit-learn>=1.3", "matplotlib>=3.7", "threadpoolctl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::smo_svm.ConvergenceWarning"]
